# Perfil LOCAL: aplicacao rodando contra o Postgres do Docker (container lokei-pg)
# Credenciais conforme o container: POSTGRES_DB=Lokei_db, user=postgres, senha=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/Lokei_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / SQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Integracoes externas desabilitadas no ambiente local (sem credenciais reais)
app.cpf.validation.enabled=false
app.cloudinary.enabled=false

# Placeholders necessarios para o contexto subir (nao usados com as flags acima desligadas)
cloudinary.url=cloudinary://disabled:disabled@disabled
secretToken=local-secret-token-please-change-0123456789-abcdef
tokenCpf=local-token-cpf
