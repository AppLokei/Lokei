spring.datasource.url=jdbc:h2:mem:lokei;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
logging.level.org.springframework.web.servlet.handler.HandlerMappingIntrospector=ERROR
app.security.jwt.secret=test-secret-key-with-at-least-32-bytes
app.storage.image-dir=target/test-uploads
