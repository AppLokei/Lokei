# DATASOURCE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
# H2 CLIENT
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# JPA, SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Cloudinary desabilitado no perfil de teste
cloudinary.url=cloudinary://test:test@test
server.port=8081
# Valores de teste para placeholders normalmente carregados via .env
tokenCpf=test-token-cpf
secretToken=test-secret-token-please-change-0123456789
# Integracoes externas desabilitadas: permite rodar e testar os endpoints sem credenciais
app.cpf.validation.enabled=false
app.cloudinary.enabled=false
