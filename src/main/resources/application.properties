spring.application.name=aplication
spring.profiles.active=${APP_PROFILE:dev}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

app.security.jwt.secret=${APP_JWT_SECRET:change-this-secret-key-to-a-secure-32-byte-value}
app.security.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:180}
app.security.password-reset.expiration-minutes=${APP_PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.storage.image-dir=${APP_IMAGE_DIR:uploads}
app.integrations.viacep-base-url=${APP_VIACEP_BASE_URL:https://viacep.com.br/ws}
app.integrations.cpf-base-url=${APP_CPF_BASE_URL:}
